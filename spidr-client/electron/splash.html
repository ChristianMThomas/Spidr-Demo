<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spidr</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
  .splash { box-sizing: border-box; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: #08090b; border: 1px solid #512028; border-radius: 8px; -webkit-app-region: drag; }
  .wordmark { width: 72%; max-width: 260px; height: auto; object-fit: contain; }
  .bar { width: 120px; height: 3px; border-radius: 2px; background: #2d171d; overflow: hidden; }
  .bar::after { content: ''; display: block; height: 100%; width: 40%; background: #ff1637; animation: scan 1.4s ease-in-out infinite; }
  .status { color: #aaaab5; font-size: 11px; letter-spacing: 0; }
  @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
</style>
</head>
<body>
  <div class="splash" role="status" aria-label="Loading Spidr">
    <img class="wordmark" src="assets/spidr-wordmark.png" alt="Spidr" />
    <div class="bar" aria-hidden="true"></div>
    <div class="status">Loading Spidr</div>
  </div>
</body>
</html>
